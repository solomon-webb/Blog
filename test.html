<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="" id="profilePic" alt="MyProfile" width="300px" height="300px" style="border-radius: 50%;object-fit: cover;" onclick="document.getElementById('profile').click()">
    <input type="file" name="" id="profile" accept="image*/" onchange="UPdateProfile()" style="display: none;" >
    <script>
        function UPdateProfile() {
            let file = document.getElementById("profile").files[0]
            if(file) {
                let reader = new FileReader()
                reader.onload= (e) => {
       let imgData =    e.target.result
       document.getElementById("profilePic").src = imgData
                }
                reader.readAsDataURL(file)
            }
        }
    </script>
</body>
</html>
